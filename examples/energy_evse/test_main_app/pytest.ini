[pytest]
# Isolate from repo-root pytest.ini / conftest.py (pytest-embedded needs --target).
# With this file present, pytest rootdir is this directory, so parent conftest is not loaded.
testpaths = tests
python_files = test_*.py
# IDF venv registers pytest_embedded globally; host-only tests do not need it (avoids --target / Dut fixtures).
addopts = --tb short -p no:pytest_embedded
