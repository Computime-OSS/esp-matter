# SonarCloud configuration for ElaadNL ESP-Matter EVSE
# Docs: https://docs.sonarcloud.io/

# --- Identity ---------------------------------------------------------------
# IMPORTANT: replace the two placeholders below with values from the
# "Information" tab of your SonarCloud project page.
sonar.organization=computime-oss
sonar.projectKey=Computime-OSS_esp-matter
sonar.projectName=esp-matter
sonar.projectVersion=1.4
sonar.host.url=https://sonarcloud.io

# --- Sources ----------------------------------------------------------------
sonar.sources=components,device_hal,examples,tools/ci

# --- Tests ------------------------------------------------------------------
# Tests share the same root dirs as sources; the inclusion patterns below
# reclassify matching files from "source" to "test".
sonar.tests=components,device_hal,examples,tools/ci,conftest.py
sonar.test.inclusions=\
  **/test/**/*.c,\
  **/test/**/*.cpp,\
  **/test/**/*.h,\
  **/tests/**/*.c,\
  **/tests/**/*.cpp,\
  **/test_*.c,\
  **/test_*.cpp,\
  **/*_test.c,\
  **/*_test.cpp,\
  **/pytest_*.py,\
  conftest.py

# --- Exclusions -------------------------------------------------------------
# connectedhomeip is a 1M+ LOC vendored submodule; never analyze it.
sonar.exclusions=\
  connectedhomeip/**,\
  **/build/**,\
  **/build_*/**,\
  **/managed_components/**,\
  **/zap-generated/**,\
  components/esp_matter/zap_common/**,\
  components/esp_matter/utils/cluster_select/**,\
  docs/_build/**,\
  patches/**,\
  **/sdkconfig*

# --- C/C++ analyzer (cfamily) ----------------------------------------------
sonar.cfamily.build-wrapper-output=bw-output
sonar.cfamily.threads=4
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar_cache

# --- Python -----------------------------------------------------------------
sonar.python.version=3.10,3.11,3.12

# --- Misc -------------------------------------------------------------------
sonar.sourceEncoding=UTF-8

# --- Incremental "new code" definition --------------------------------------
# This anchors all branch and PR diffs to release/v1.4. The same setting
# should also be set in SonarCloud UI:
#   Project -> Administration -> New Code -> Reference branch -> release/v1.4
# sonar.newCode.referenceBranch=release/v1.4
